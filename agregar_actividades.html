<body>

    <section class="panel">

        <div class="panel-content">
            <h3>ACTIVIDADES</h3>

            <form class="formulario">
                <h4>Registrar nueva actividad</h4>
                <div class="inputs">
                    <div>
                        <label>Semana</label>
                        <input type="text" placeholder="Ingrese Semana">
                    </div>
                    <div>
                        <label>Tema</label>
                        <input type="text" placeholder="Ingrese el Tema">
                    </div>
                    <div class="file-input">
                        <label for="archivo">Archivo</label>
                        <input type="file" id="archivo">
                    </div>
                    <button class="btn-add-edit">Registrar</button>
                </div>
            </form>

            <form class="formulario">
                <h4>Editar actividad</h4>
                <div class="inputs">
                    <div>
                        <label>Semana</label>
                        <input type="text" placeholder="Ingrese Semana">
                    </div>
                    <div>
                        <label>Tema</label>
                        <input type="text" placeholder="Ingrese el Tema">
                    </div>
                    <div class="file-input">
                        <label for="archivo">Archivo</label>
                        <input type="file" id="archivo">
                    </div>
                    <button class="btn-add">Actualizar</button>
                </div>
            </form>

            <table class="tabla">
                <thead>
                    <tr>
                        <th>Semana</th>
                        <th>Tema</th>
                        <th>Archivo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>...</td>
                        <td>...</td>
                        <td>...</td>
                        <td>
                            <a href="#"><img src="img/editar.png" alt="editar"></a>
                            <a href="#"><img src="img/eliminar.png" alt="eliminar"></a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

<script>
/* ==========================
   SESIÓN
   ========================== */
if (localStorage.getItem("sesionActiva") !== "true") {
  window.location.href = "login.html";
}

function cerrarSesion() {
  localStorage.removeItem("sesionActiva");
  localStorage.removeItem("usuario");
  window.location.href = "login.html";
}

const salirLink = document.querySelector(".item-salir a");
if (salirLink) {
  salirLink.addEventListener("click", function (e) {
    e.preventDefault();
    cerrarSesion();
  });
}

/* ==========================
   ACTIVIDADES (CRUD con localStorage)
   ========================== */
let actividades = JSON.parse(localStorage.getItem("actividades")) || [];
let editIndex = null; // índice de actividad que se está editando

const tablaBody = document.querySelector(".tabla tbody");
const registrarForm = document.querySelectorAll(".formulario")[0];
const editarForm = document.querySelectorAll(".formulario")[1];

// Renderizar actividades en la tabla
function mostrarActividades() {
  tablaBody.innerHTML = "";

  if (actividades.length === 0) {
    tablaBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#666;">No hay actividades registradas.</td></tr>`;
    return;
  }

  actividades.forEach((act, index) => {
    const fila = document.createElement("tr");
    fila.innerHTML = `
      <td>${act.semana}</td>
      <td>${act.tema}</td>
      <td>${act.archivo ? act.archivo.replace("pdf/", "") : "Sin archivo"}</td>
      <td>
        <a href="#" class="btn-editar" data-index="${index}"><img src="img/editar.png" alt="editar"></a>
        <a href="#" class="btn-eliminar" data-index="${index}"><img src="img/eliminar.png" alt="eliminar"></a>
      </td>
    `;
    tablaBody.appendChild(fila);
  });
}

// Delegación de eventos para editar / eliminar (más robusto)
tablaBody.addEventListener("click", function (e) {
  const editBtn = e.target.closest(".btn-editar");
  if (editBtn) {
    e.preventDefault();
    const i = Number(editBtn.dataset.index);
    editIndex = i;
    cargarActividad(i);
    // Llevar la vista al formulario de edición para mejor UX:
    editarForm.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }

  const delBtn = e.target.closest(".btn-eliminar");
  if (delBtn) {
    e.preventDefault();
    const i = Number(delBtn.dataset.index);

    // confirm antes de eliminar
    const ok = confirm("¿Seguro que quieres eliminar esta actividad? Esta acción no se puede deshacer.");
    if (!ok) return;

    actividades.splice(i, 1);
    localStorage.setItem("actividades", JSON.stringify(actividades));

    // si está editando una fila y esa fila se borró, resetear el editIndex
    if (editIndex !== null) {
      if (editIndex === i) {
        editIndex = null;
        editarForm.reset();
      } else if (editIndex > i) {
        editIndex = editIndex - 1; // ajustar índice
      }
    }

    mostrarActividades();
    return;
  }
});

// Cargar actividad en formulario de edición
function cargarActividad(index) {
  const act = actividades[index];
  if (!act) return;
  editarForm.querySelectorAll("input")[0].value = act.semana;
  editarForm.querySelectorAll("input")[1].value = act.tema;
  // Nota: el campo archivo no se puede rellenar por seguridad (input file).
}

// Registrar nueva actividad
registrarForm.addEventListener("submit", (e) => {
  e.preventDefault();
  const semana = registrarForm.querySelectorAll("input")[0].value.trim();
  const tema = registrarForm.querySelectorAll("input")[1].value.trim();
  const archivoInput = registrarForm.querySelector('input[type="file"]');
  const archivo = archivoInput.files[0] ? "pdf/" + archivoInput.files[0].name : "";


  if (semana === "" || tema === "") {
    alert("⚠️ Completa todos los campos");
    return;
  }

  actividades.push({ semana, tema, archivo });
  localStorage.setItem("actividades", JSON.stringify(actividades));
  registrarForm.reset();
  mostrarActividades();
});

// Editar actividad existente
editarForm.addEventListener("submit", (e) => {
  e.preventDefault();
  if (editIndex === null) {
    alert("⚠️ Selecciona una actividad para editar");
    return;
  }
  const semana = editarForm.querySelectorAll("input")[0].value.trim();
  const tema = editarForm.querySelectorAll("input")[1].value.trim();
  const archivoInput = editarForm.querySelector('input[type="file"]');
  const archivo = archivoInput && archivoInput.files[0] 
  ? "pdf/" + archivoInput.files[0].name 
  : actividades[editIndex].archivo || "";


  if (semana === "" || tema === "") {
    alert("⚠️ Completa todos los campos");
    return;
  }

  actividades[editIndex] = { semana, tema, archivo };
  localStorage.setItem("actividades", JSON.stringify(actividades));
  editarForm.reset();
  editIndex = null;
  mostrarActividades();
});

// Inicializar vista
mostrarActividades();
</script>





</body>
