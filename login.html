<!-- Modal pantalla completa -->

    <iframe id="iframe-pdf" src=""></iframe>
</div>

<body>

    <!-- Video de fondo -->
    <video autoplay muted loop playsinline class="video-fondo">
        <source src="video/Genshin Impact 2024.10.29 - 18.26.47.01.mp4" type="video/mp4">
        Tu navegador no soporta video HTML5.
    </video>

    <!-- Capa con blur -->
    <div class="overlay"></div>

    <header>
        <nav class="navbar">
            <div class="logo"><img src="img/logo.png" alt="logo"></div>
            <ul class="nav-links">
                <li><a href="index.html">HOME</a></li>

                <li><a href="login.html"><img src="img/user.png" alt="user"></a></li>
            </ul>
        </nav>
    </header>

    <section class="login-container">
        <div class="login-box">
            <h3>LOGIN</h3>
            <form id="loginForm">
                <div class="input-group">
                    <img src="img/usuario.png" alt="user icon">
                    <input type="text" id="usuario" placeholder="Usuario">
                </div>

                <div class="input-group">
                    <img src="img/clave.png" alt="lock icon">
                    <input type="password" id="clave" placeholder="Contraseña">
                </div>

                <button type="submit" class="btn">INGRESAR</button>
            </form>
        </div>

        <script>
            document.getElementById("loginForm").addEventListener("submit", function (e) {
                e.preventDefault(); // evita que se recargue la página

                const usuario = document.getElementById("usuario").value.trim();
                const clave = document.getElementById("clave").value.trim();

                if (usuario === "" || clave === "") {
                    alert("⚠️ Por favor completa todos los campos.");
                    return;
                }

                if (usuario === "admin" && clave === "123") {
                    alert("Login correcto, bienvenido " + usuario);
                    window.location.href = "agregar_actividades.html";
                } else {
                    alert("Usuario o contraseña incorrectos.");
                }
            });
        </script>

    </section>
