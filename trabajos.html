        rel="stylesheet">

<!-- Modal pantalla completa -->
<div id="modal-pdf" class="modal">
    <span class="cerrar" onclick="cerrarPDF()">&times;</span>
    <iframe id="iframe-pdf" src=""></iframe>
</div>

<body>

    <!-- Video de fondo -->
    <video autoplay muted loop playsinline class="video-fondo">
        <source src="video/Genshin Impact 2024.10.29 - 18.26.47.01.mp4" type="video/mp4">
        Tu navegador no soporta video HTML5.
    </video>

    <!-- Capa con blur -->
    <div class="overlay"></div>

    <header>
        <nav class="navbar">
            <div class="logo"><img src="img/logo.png" alt="logo"></div>
            <ul class="nav-links">
                <li><a href="index.html">HOME</a></li>
                <li><a href="sobre.html">SOBRE MÍ</a></li>
                <li><a href="trabajos.html">TRABAJOS</a></li>
                <li><a href="login.html"><img src="img/user.png" alt="user"></a></li>
            </ul>
        </nav>
    </header>

    <section class="actividades-cabecera">
        <div class="curso">
            <h3>PROYECTO DE APLICACIÓN PROFESIONAL</h3>
            <h4>Ing. Fernández Bejarano Raúl Enrique</h4>
        </div>
        <img src="img/logo_iestp.png" alt="logo_iestp">
    </section>


    <section class="actividades">
        <div class="grid">


            <div class="card">
                <img src="img/tarea.png" alt="actividad">
                <h3>SEMANA 1</h3>
                <p>Fundamentos de un proyecto web</p>
                <div class="acciones">
                    <button class="btn" onclick="abrirPDF('pdf/ORGANIZADOR DE PAP.pdf')">Ver</button>
                    <a href="pdf/ORGANIZADOR DE PAP.pdf" download>
                        <button class="btn-descargar"><img src="img/descargar.png" alt="descargar"></button>
                    </a>
                </div>
            </div>


            <div class="card">
                <img src="img/tarea.png" alt="actividad">
                <h3>SEMANA 2</h3>
                <p>Actores y organización del Proyecto Web</p>
                <div class="acciones">
                    <button class="btn" onclick="abrirPDF('pdf/TAREA 2 - TAP.pdf')">Ver</button>
                    <a href="pdf/TAREA 2 - TAP.pdf" download>
                        <button class="btn-descargar"><img src="img/descargar.png" alt="descargar"></button>
                    </a>
                </div>
            </div>


        </div>
    </section>

    <script>
        // Funciones para abrir y cerrar PDF
        function abrirPDF(ruta) {
            document.getElementById("iframe-pdf").src = ruta;
            document.getElementById("modal-pdf").style.display = "flex";
        }

        function cerrarPDF() {
            document.getElementById("modal-pdf").style.display = "none";
            document.getElementById("iframe-pdf").src = "";
        }

        // ==========================
        // MOSTRAR ACTIVIDADES DESDE JSON
        // ==========================
        const grid = document.querySelector(".grid");

        async function mostrarActividades() {
            grid.innerHTML = "<p>Cargando actividades...</p>";

            try {
                const res = await fetch("actividades.json"); // asegúrate de que está en la raíz
                const actividades = await res.json();

                grid.innerHTML = ""; // limpiamos

                if (actividades.length === 0) {
                    grid.innerHTML = "<p>No hay actividades registradas.</p>";
                    return;
                }

                actividades.forEach((act) => {
                    const card = document.createElement("div");
                    card.classList.add("card");

                    card.innerHTML = `
                <img src="img/tarea.png" alt="actividad">
                <h3>SEMANA ${act.semana}</h3>
                <p>${act.tema}</p>
                <div class="acciones">
                    <button class="btn" onclick="abrirPDF('${act.archivo || ''}')">Ver</button>
                    <a href="${act.archivo || '#'}" download>
                        <button class="btn-descargar"><img src="img/descargar.png" alt="descargar"></button>
                    </a>
                </div>
            `;

                    grid.appendChild(card);
                });
            } catch (error) {
                grid.innerHTML = "<p style='color:red;'>Error cargando actividades.</p>";
                console.error(error);
            }
        }

        // Mostrar al cargar
        mostrarActividades();

    </script>

</body>

</html>
